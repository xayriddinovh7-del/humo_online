name: humo_online
description: "Video Darslik Platformasi — onlayn ta'lim"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^3.4.3

  # Navigation
  go_router: ^18.0.1

  # Network
  dio: ^5.7.0
  connectivity_plus: ^7.3.1

  # Video
  video_player: ^2.9.2
  chewie: ^1.8.5

  # File Handling
  file_picker: ^13.1.0

  # Storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5

  # UI & UX
  cached_network_image: ^4.0.0
  shimmer: ^4.0.0
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.3
  timeago: ^3.7.0
  percent_indicator: ^4.2.4
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/lottie/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

